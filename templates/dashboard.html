<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The Expedition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='The_Expedition.ico') }}">

</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/dashboard" class="nav-logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
            <span>The-Expedition</span>
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="/about_us" class="nav-link">About Us</a>
                </li>
                <li class="nav-item">
                    <a href="/contact_us" class="nav-link">Contact</a>
                </li>
                <li class="nav-item">
                    <a href="/book" class="nav-link nav-btn">Book Now</a>
                </li>
                <li class="nav-item">
                    <a href="/" class="nav-link nav-logout">Logout</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <h2 class="header">Welcome, {{ user }}</h2>

    <div class="container">

        <!-- CLICKABLE CARD -->
        <a href="/attraction" class="card-link">

            <div class="card">

                <h3>Tourist Attractions</h3>

                <img src="{{ url_for('static', filename='phtohan.jpg') }}" 
                    alt="Tourist Attractions">

                <p class="explore-text">Explore →</p>

            </div>

        </a>

    </div>
    <!-- JAVASCRIPT -->
<script>
document.addEventListener('DOMContentLoaded', function() {

    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');

    hamburger.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        hamburger.classList.toggle('active');
    });

    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
            navMenu.classList.remove('active');
            hamburger.classList.remove('active');
        });
    });

});
</script>
</body>

</html>
