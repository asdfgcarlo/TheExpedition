<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attractions - The Expedition</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='attraction.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='The_Expedition.ico') }}">

</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-container">

            <a href="/dashboard" class="nav-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" 
                     alt="Logo" 
                     class="logo-img">

            </a>

            <ul class="nav-menu">

                <li class="nav-item">

                <li class="nav-item">

                <li class="nav-item">
                    <a href="/" class="nav-link nav-logout">Logout</a>
                </li>

            </ul>

            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

        </div>

    </nav>

    <!-- PAGE TITLE -->
    <h1 class="title">Tourist Attractions</h1>

        <div class="gallery-item">

        <div class="gallery-item">
            <img src="{{ url_for('static', filename='hoa_lu_ancient_capital.jpg') }}" alt="Attraction 6">

    <!-- JAVASCRIPT -->
    <script>

    document.addEventListener('DOMContentLoaded', function() {

        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');

        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            hamburger.classList.toggle('active');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
                hamburger.classList.remove('active');
            });
        });

    });

    </script>

</body>
</html>
