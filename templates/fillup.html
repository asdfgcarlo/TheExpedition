<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ flight }} - The Expedition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='fillup.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='The_Expedition.ico') }}">

</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <a href="/dashboard" class="nav-logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
            <span>The-Expedition</span>
            </a>

        <ul class="nav-menu">
            <li class="nav-item"><a href="/dashboard" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="/about_us" class="nav-link">About Us</a></li>
            <li class="nav-item"><a href="/contact_us" class="nav-link">Contact</a></li>
            <li class="nav-item"><a href="/book" class="nav-link nav-btn">Book Now</a></li>
            <li class="nav-item"><a href="/logout" class="nav-link nav-logout">Logout</a></li>
        </ul>

        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

    </div>
</nav>


<div class="container">

    <div class="booking-form-card">

        <div class="form-header">
            <h2>{{ flight }}</h2>

            <div class="price-display">
                ₱ {{ price }} <span class="per-pax">per pax</span>
            </div>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Contact Person</label>
                <input name="contact" type="text" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label>Number of Passengers</label>
                <input name="pax" type="number" min="1" placeholder="1" required>
            </div>

            <button type="submit">Book Now</button>
        </form>

        <a href="/book" class="back-link">← Back to Flights</a>

    </div>

</div>


<script>
document.addEventListener('DOMContentLoaded', function () {
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');

    hamburger.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        hamburger.classList.toggle('active');
    });

    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
            navMenu.classList.remove('active');
            hamburger.classList.remove('active');
        });
    });
});
</script>

</body>
</html>
